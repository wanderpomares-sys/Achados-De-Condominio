name: Condomínios da Receita Federal
on:
  workflow_dispatch:
    inputs:
      cidades:
        description: 'Cidades separadas por ; (ex.: Mogi das Cruzes;São José dos Campos)'
        required: true
        default: 'Mogi das Cruzes;São José dos Campos'
  schedule:
    - cron: '17 6 20 * *'   # todo dia 20, depois que a Receita publica o mês
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Instalar DuckDB
        run: pip install duckdb
      - name: Gerar listas
        timeout-minutes: 200
        run: python3 scripts/receita.py "${{ github.event.inputs.cidades || 'Mogi das Cruzes;São José dos Campos' }}"
      - name: Publicar
        if: always()
        run: |
          git config user.name "achados-bot"
          git config user.email "achados-bot@users.noreply.github.com"
          git add data/condominios
          git diff --cached --quiet || git commit -m "Lista de condomínios (Receita Federal) atualizada"
          git pull --rebase -X theirs -q || (git rebase --abort; git pull --no-rebase -X theirs -q --no-edit)
          git push
